[Settings]
language = es
folder = ~/Imágenes/wallpapers
monitors = All
wallpaper = ~/Imágenes/wallpapers/001.jpg
show_path_in_tooltip = True
backend = awww
fill = fill
sort = name
color = #ffffff
subfolders = True
all_subfolders = True
show_hidden = False
show_gifs_only = False
zen_mode = True
post_command = matugen image --source-color-index 0 $wallpaper && cp $wallpaper ~/.config/hypr/img.png && notify-send "Theme Applied"
number_of_columns = 3
swww_transition_type = any
swww_transition_step = 63
swww_transition_angle = 0
swww_transition_duration = 2
swww_transition_fps = 60
mpvpaper_sound = False
mpvpaper_options = 
use_xdg_state = False
stylesheet = ~/.config/waypaper/style.css
keybindings = ~/.config/waypaper/keybindings.ini

